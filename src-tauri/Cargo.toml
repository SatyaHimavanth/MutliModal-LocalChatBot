[package]
name = "multimodal-local-chatbot"
version = "1.0.0"
description = "Local-first multimodal RAG desktop application"
edition = "2021"

[features]
default = []
mcp-demo = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
calamine = "=0.36.1"
csv = "=1.4.0"
http = "1"
langchain-rust = { version = "8", default-features = false }
pdf-extract = "=0.12.1"
quick-xml = "=0.41.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
rmcp = { version = "=3.10.0", default-features = false, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "0.38", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
symphonia = { version = "=0.5.5", default-features = false, features = ["flac", "mp3", "pcm", "wav"] }
sqlite-vec = "0.1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["macros", "process", "rt", "sync", "time"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
rmcp = { version = "=3.10.0", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_UI_Controls_Dialogs"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
